<!DOCTYPE html>
<html lang="bg" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#FBF6F2">
    <title>Моят акаунт — Beauty House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="nav">
        <div class="nav__inner">
            <a class="brand" href="index.html"><span class="brand__mark brand__mark--logo"><img src="img/LogoBH.jpg" alt="Beauty House"></span><span>Beauty <b>House</b></span></a>
            <nav class="nav__links" id="nav-links">
                <a class="nav__link" href="index.html">Начало</a>
                <a class="nav__link" href="services.html">Услуги</a>
                <a class="nav__link" href="courses.html">Курсове</a>
                <a class="nav__link" href="team.html">Екип</a>
                <a class="nav__link" href="booking.html">Запази час</a>
                <a class="nav__link" href="contact.html">Контакти</a>
            </nav>
            <div class="nav__actions">
                <div class="nav__actions" id="nav-auth"></div>
                <button class="nav__toggle" id="nav-toggle" aria-label="Меню" aria-expanded="false"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <section class="section" style="padding-top:calc(var(--nav-h) + 48px);min-height:70svh">
        <div class="container" style="max-width:820px;padding-inline:clamp(20px, 6vw, 44px)">
            <div class="section__head reveal" style="margin-bottom:2rem">
                <h1 style="margin:0 0 .4rem">Моят акаунт</h1>
                <p class="lead">Име, имейл и парола за вход.</p>
            </div>
            <div class="card" style="padding:1.3rem 1.4rem;display:grid;gap:1.4rem">
                <div class="acc-sec">
                    <div class="acc-head">
                        <span class="acc-title">Лични данни</span>
                        <button type="button" class="acc-edit" id="acc-edit" aria-label="Редактирай личните данни" title="Редактирай"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button>
                    </div>
                    <dl class="acc-view" id="acc-view">
                        <div><dt>Име и фамилия</dt><dd id="acc-v-name">—</dd></div>
                        <div><dt>Имейл</dt><dd id="acc-v-email">—</dd></div>
                    </dl>
                    <form id="acc-form" class="acc-form" hidden>
                        <div class="field"><label for="acc-name">Име и фамилия</label><input class="input" id="acc-name" required placeholder="Име Фамилия" autocomplete="name"></div>
                        <div class="field"><label for="acc-email">Имейл</label><input class="input" type="email" id="acc-email" required placeholder="ти@example.com" autocomplete="email"></div>
                        <div class="acc-actions">
                            <button class="btn btn--primary" type="submit" style="--pad-y:.6rem;--pad-x:1.3rem;font-size:.85rem">Запази</button>
                            <button class="btn btn--ghost acc-cancel" type="button" style="--pad-y:.6rem;--pad-x:1.3rem;font-size:.85rem">Откажи</button>
                        </div>
                    </form>
                    <div class="acc-msg"></div>
                </div>
                <div class="acc-sec acc-sec--line">
                    <div class="acc-head">
                        <span class="acc-title">Парола</span>
                        <button type="button" class="acc-edit" id="pwd-edit" aria-label="Смени паролата" title="Смени паролата"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button>
                    </div>
                    <dl class="acc-view" id="pwd-view">
                        <div><dt>Парола за вход</dt><dd>••••••••</dd></div>
                    </dl>
                    <form id="pwd-form" class="acc-form" hidden>
                        <div class="field"><label for="pwd-current">Текуща парола</label><input class="input" type="password" id="pwd-current" required placeholder="••••••••" autocomplete="current-password"></div>
                        <div class="field"><label for="pwd-new">Нова парола</label><input class="input" type="password" id="pwd-new" required minlength="6" placeholder="мин. 6 символа" autocomplete="new-password"></div>
                        <div class="acc-actions">
                            <button class="btn btn--primary" type="submit" style="--pad-y:.6rem;--pad-x:1.3rem;font-size:.85rem">Смени паролата</button>
                            <button class="btn btn--ghost acc-cancel" type="button" style="--pad-y:.6rem;--pad-x:1.3rem;font-size:.85rem">Откажи</button>
                        </div>
                    </form>
                    <div class="pwd-msg"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/icons.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
